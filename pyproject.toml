[project]
name = "pythonproject7"
version = "0.1.0"
description = ""
authors = [
    {name = "Ваше Имя"}
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black>=25.1.0,<26.0.0",
    "isort>=6.0.0,<7.0.0",
    "mypy>=1.15.0,<2.0.0",
    "ruff>=0.9.0,<0.10.0"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv", ".venv"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "ANN", "I"]
fixable = ["ALL"]
