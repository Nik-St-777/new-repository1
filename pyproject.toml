[project]
name = "pythonproject7"
version = "0.1.0"
description = ""
authors = [
    {name = "твое имя"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv", ".venv"]

[tool.ruff]
# Включаем правила Flake8 (E, F, W) и типизацию (ANN)
lint.select = ["E", "F", "W", "ANN", "I"]

[tool.ruff.lint]
# Разрешаем Ruff автоматически исправлять всё, что он может
fixable = ["ALL"]

